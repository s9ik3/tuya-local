name: Inertia radiator
products:
  - manufacturer: CIARRA
    model: CBHTD15A-W
  - manufacturer: CIARRA
    model: CBHTD10A-W
  - manufacturer: CIARRA
    model: CBHTD15A-B
  - manufacturer: CIARRA
    model: CBHTD20A-W
entities:
  - entity: climate
    translation_only_key: heater
    dps:
      - id: 1
        name: hvac_mode
        type: boolean
        mapping:
          - dps_val: true
            value: heat
          - dps_val: false
            value: "off"
      - id: 2
        name: temperature
        type: integer
        unit: C
        range:
          min: 15
          max: 290
        mapping:
          - scale: 10
            step: 5
      - id: 4
        name: preset_mode
        type: string
        mapping:
          - dps_val: comfortable
            value: comfort
          - dps_val: eco
            value: eco
          - dps_val: antifreeze
            value: away
  - entity: switch
    name: Eco mode
    icon: "mdi:leaf"
    category: config
    dps:
      - id: 6
        name: switch
        type: boolean
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 7
        name: lock
        type: boolean
  - entity: light
    translation_key: display
    category: config
    dps:
      - id: 10
        name: switch
        type: boolean
  - entity: switch
    name: Weekly schedule
    icon: "mdi:calendar-clock"
    category: config
    dps:
      - id: 101
        name: switch
        type: boolean
